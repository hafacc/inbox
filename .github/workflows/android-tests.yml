name: android tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      # :core:test runs shared/src/pgp/interop.ts to check Bouncy Castle against openpgp.js.
      - uses: ./.github/actions/setup-bun
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :core:detekt :app:detekt
