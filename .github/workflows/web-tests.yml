name: web tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Everything in TypeScript but the Firestore rules: shared, web, functions and the Workers.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bun run lint
      # web's test also builds the site into web/out, service worker included
      - run: bun run --filter '*' --filter '!@inbox/firebase' test

  # The Firestore rules tests run in the emulator, which needs the Firebase CLI on Node and a JVM.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/setup-bun
      # firebase-tools is pinned in firebase/package.json, so that file also keys the emulator download
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase/package.json') }}
      - run: bun run test
        working-directory: firebase
