# Deploy Firebase: functions, Firestore rules and indexes. Started by hand, from main.
name: deploy-firebase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  # Started from another branch, nothing runs.
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/web-tests.yml

  # Auth is Workload Identity Federation: no key is stored, and the provider accepts only this
  # repo's OIDC tokens.
  firebase:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: ./.github/actions/setup-bun
      # firebase-tools is the one pinned in firebase/package.json.
      # --force answers what a non-interactive deploy can't: deleting a function that has left the
      # source (remember it when renaming one) and the retry policies of event-triggered functions.
      - run: >-
          bun run firebase deploy --config ../firebase.json --project hafa-inbox --non-interactive
          --force --only functions,firestore:rules,firestore:indexes
        working-directory: firebase
