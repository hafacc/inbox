# Publish a tagged Android release in two jobs: `bundle` builds the signed bundle, keeps it as the
# run's artifact and creates the GitHub release; `play` uploads that same bundle to Play's internal
# testing track, rolled out to testers. Started by cut-android.yml; run it by hand to retry a tag. If
# Play refuses, re-run the failed job: it uploads the bundle already built. An app's first publish
# fails at Play, which wants that bundle uploaded by hand: take it from the artifact. Promote it in
# the Play Console.
name: publish android

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. android-v1.0.1)
        required: true
        type: string

permissions: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Firebase config is committed (FirebaseConfig.kt), so only the upload key is restored.
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: base64 --decode <<< "$ANDROID_KEYSTORE" > "$RUNNER_TEMP/upload.jks"
      - name: Build the bundle
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:bundleRelease
          "-Pinbox.storeFile=$RUNNER_TEMP/upload.jks"
          "-Pinbox.storePassword=$STORE_PASSWORD"
          "-Pinbox.keyAlias=$KEY_ALIAS"
          "-Pinbox.keyPassword=$KEY_PASSWORD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inbox-${{ inputs.tag }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            exit 0
          fi
          # notes cover only what changed since the last Android release
          if previous=$(git describe --tags --abbrev=0 --match "android-v*" "$TAG^" 2>/dev/null); then
            gh release create "$TAG" --generate-notes --verify-tag --notes-start-tag "$previous"
          else
            gh release create "$TAG" --generate-notes --verify-tag
          fi

  play:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inbox-${{ inputs.tag }}
          path: ${{ runner.temp }}/bundle
      - name: Upload to Play
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        # Play refuses a rolled-out release while the app has never passed review; a draft is rolled out by hand.
        run: |
          publish() {
            ./gradlew :app:publishReleaseBundle --release-status "$1" \
              --artifact-dir "$RUNNER_TEMP/bundle"
          }
          if ! publish completed; then
            echo "::warning::Play refused a rolled-out release; uploading a draft to roll out by hand."
            publish draft
          fi
