# Deploy the Cloudflare Workers. Started by hand, from main.
name: deploy-workers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  # Started from another branch, nothing runs.
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/web-tests.yml

  workers:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      # Until the KV namespace id is filled in, skip only this Worker so the rest still deploys.
      - name: Deploy the WKD Worker
        working-directory: workers/wkd
        run: |
          if grep -q REPLACE_WITH_KV_NAMESPACE_ID wrangler.jsonc; then
            echo "::warning file=workers/wkd/wrangler.jsonc::WKD Worker not deployed: create the inbox-wkd-keys KV namespace and put its id in kv_namespaces[0].id."
          else
            bun run deploy
          fi
