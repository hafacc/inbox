name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      product:
        description: Check only this product (web or android); empty checks both
        type: string
        default: ""
      ref:
        description: Commit to check out; empty checks out the one that started the run
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Everything in TypeScript but the Firestore rules: shared, web, functions and the Workers.
  web:
    if: inputs.product == '' || inputs.product == 'web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-bun
      - run: bun run lint
      # web's test also builds the site into web/out, service worker included
      - run: bun run --filter '*' --filter '!@inbox/firebase' test
      # deploy.yml publishes this build rather than building the site again
      - if: inputs.product == 'web'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/out
          # .well-known/assetlinks.json, which passkeys on Android need
          include-hidden-files: true

  # The Firestore rules tests run in the emulator, which needs the Firebase CLI on Node and a JVM.
  rules:
    if: inputs.product == '' || inputs.product == 'web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/setup-bun
      # firebase-tools is pinned in firebase/package.json, so that file also keys the emulator download
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase/package.json') }}
      - run: bun run test
        working-directory: firebase

  android:
    if: inputs.product == '' || inputs.product == 'android'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      # :core:test runs shared/src/pgp/interop.ts to check Bouncy Castle against openpgp.js.
      - uses: ./.github/actions/setup-bun
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :core:detekt :app:detekt
